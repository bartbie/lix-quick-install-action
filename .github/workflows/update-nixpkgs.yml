concurrency:
  cancel-in-progress: false
  group: update-nixpkgs
jobs:
  gate:
    if: needs.prepare.outputs.changed == 'true'
    needs: prepare
    secrets: inherit
    uses: ./.github/workflows/cicd.yml
    with:
      ref: auto/update-nixpkgs
  merge:
    if: needs.prepare.outputs.changed == 'true'
    needs:
      - prepare
      - gate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: main
      - name: Fast-forward main to auto/update-nixpkgs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin auto/update-nixpkgs:auto/update-nixpkgs
          git merge --ff-only auto/update-nixpkgs
          git push origin main
          git push origin --delete auto/update-nixpkgs
    timeout-minutes: 60
  prepare:
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {}
      - uses: bartbie/lix-quick-install-action@e07739546a849eef488721581ac80fd10b5fa2d8
        with:
          lix_archives_url: https://github.com/bartbie/lix-quick-install-action/releases/download/1.0.0
          lix_version: 2.95.2
      - name: Update nixpkgs
        run: nix-shell ./shell.nix --run 'npins update nixpkgs'
      - id: diff
        name: Check for changes
        run: |
          if git diff --quiet npins/sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        name: Regenerate repo files
        run: nix-shell ./shell.nix --run write-repo
      - if: steps.diff.outputs.changed == 'true'
        name: Bump release version
        run: nix-shell ./shell.nix --run bump-release-minor
      - if: steps.diff.outputs.changed == 'true'
        name: Push to auto/update-nixpkgs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B auto/update-nixpkgs
          git add -A
          git commit -m 'chore: bump nixpkgs'
          git push --force origin auto/update-nixpkgs
    timeout-minutes: 60
name: Update nixpkgs
"on":
  schedule:
    - cron: 0 6 * * 1
