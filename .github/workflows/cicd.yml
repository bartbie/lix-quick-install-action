# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: bartbie/lix-quick-install-action@e07739546a849eef488721581ac80fd10b5fa2d8
        with:
          lix_archives_url: https://github.com/bartbie/lix-quick-install-action/releases/download/1.0.0
          lix_version: 2.95.2
      - uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: bartbie
      - if: matrix.os == 'ubuntu-24.04-arm'
        name: Fix Lix tests (ubuntu-24.04-arm)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
      - id: build-lix-archives
        name: Build Lix archives
        run: |
          ./scripts/nix-build-pkg.sh combined-archives
          echo "result=$(readlink result)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lix-archives-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.build-lix-archives.outputs.result }}/
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    timeout-minutes: 60
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - test
      - test-cachix
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lix-archives-Linux-X64
          path: /tmp/archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lix-archives-Linux-ARM64
          path: /tmp/archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lix-archives-macOS-X64
          path: /tmp/archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lix-archives-macOS-ARM64
          path: /tmp/archives
      - uses: ./
        with:
          lix_archives_url: file:///tmp/archives
          lix_version: 2.95.2
      - uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: bartbie
      - name: Build release script
        run: ./scripts/nix-build-pkg.sh release-script
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Release if needed
        run: |
          ./result/bin/release /tmp/archives ./RELEASE
    timeout-minutes: 60
  test:
    needs: build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: lix-archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lix-archives-${{ runner.os }}-${{ runner.arch }}
      - uses: ./
        with:
          lix_archives_url: file://${{ steps.lix-archives.outputs.download-path }}
          lix_on_tmpfs: true
          lix_version: ${{ matrix.version }}
      - name: Test nix
        run: nix-build -v --version
      - name: Add to store
        run: |
          file="$RANDOM"
          echo "$RANDOM" > "$file"
          path="$(nix-store --add "./$file")"
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
        version:
          - 2.95.2
          - 2.94.2
    timeout-minutes: 60
  test-cachix:
    needs: build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: lix-archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lix-archives-${{ runner.os }}-${{ runner.arch }}
      - uses: ./
        with:
          lix_archives_url: file://${{ steps.lix-archives.outputs.download-path }}
          lix_version: ${{ matrix.version }}
      - uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
        with:
          name: bartbie
          skipPush: true
      - name: Verify nix config
        run: |
          if ! egrep -q "^substituters = https://cache.nixos.org https://bartbie.cachix.org$" "$HOME/.config/nix/nix.conf"; then
            echo "Invalid substituters config"
            exit 1
          fi
      - env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        if: github.event_name == 'push' && github.repository_owner == 'bartbie'
        name: Push to Cachix
        run: |
          dd if=/dev/urandom of=random count=1
          cachix push bartbie "$(nix add-to-store random)"
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
        version:
          - 2.95.2
          - 2.94.2
    timeout-minutes: 60
name: CI/CD
"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        default: ""
        description: null
        required: false
        type: string
permissions:
  contents: read
